name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Release signing: only used when the NUMIO_KEYSTORE_BASE64 secret exists.
      # Without it the APK is signed with the runner's throwaway debug key (fine for testing).
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.NUMIO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/numio.jks"
            echo "NUMIO_KEYSTORE_PATH=$RUNNER_TEMP/numio.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          NUMIO_KEYSTORE_PASSWORD: ${{ secrets.NUMIO_KEYSTORE_PASSWORD }}
          NUMIO_KEY_ALIAS: ${{ secrets.NUMIO_KEY_ALIAS }}
          NUMIO_KEY_PASSWORD: ${{ secrets.NUMIO_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log

      # On failure, turn the first error lines into annotations so they show on the run page.
      - name: Report build errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong|^ +> |error:|Could not" build.log | grep -v "> Task" | head -30 | while IFS= read -r line; do
            echo "::error::${line//%/%25}"
          done

      - name: Name the APK
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="NotesbyNumio-${GITHUB_REF_NAME}.apk"
          else
            NAME="NotesbyNumio-test.apk"
          fi
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK_NAME=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      # Every push to main refreshes one "Test build" pre-release you can open on your phone.
      - name: Publish test build
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build -y --cleanup-tag || true
          gh release create test-build "$APK_NAME" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Test build" \
            --notes "Latest build from main (${GITHUB_SHA::7}). For testing only."

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK_NAME" --title "$APK_NAME" --generate-notes
